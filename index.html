<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#06040e; --ink:#f4ecff; --violet:#8b5cf6; --magenta:#d946ef; --pink:#f472b6; --lilac:#e9d5ff; --glass:rgba(30,16,48,.5); }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--ink); font-family:'Space Grotesk',system-ui,sans-serif;
    overflow:hidden; height:100vh; -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; touch-action:none; }
  canvas#scene{ position:fixed; inset:0; z-index:-2; display:block; width:100%; height:100vh; }
  .vignette{ position:fixed; inset:0; z-index:-1; pointer-events:none; background:radial-gradient(80% 64% at 50% 48%, transparent 56%, rgba(2,1,5,.7) 100%); }
  .beat{ position:fixed; left:0; right:0; bottom:15vh; text-align:center; z-index:5; pointer-events:none; color:var(--lilac);
    font-size:clamp(1rem,2.8vmin,1.4rem); letter-spacing:.04em; opacity:0; transition:opacity .9s ease; text-shadow:0 2px 24px #000; }
  .beat.show{ opacity:.92; }
  .hintbar{ position:fixed; left:0; right:0; bottom:5vh; text-align:center; z-index:5; pointer-events:none; color:var(--lilac);
    font-size:.8rem; letter-spacing:.18em; text-transform:uppercase; opacity:0; transition:opacity 1s ease; }
  .hintbar.show{ opacity:.55; }
  #gate{ position:fixed; inset:0; z-index:30; display:flex; flex-flow:column; align-items:center; justify-content:center;
    gap:1.3rem; text-align:center; padding:2rem; background:radial-gradient(80% 60% at 50% 42%, rgba(24,12,40,.6), rgba(4,2,10,.96));
    backdrop-filter:blur(6px); transition:opacity 1s ease; }
  #gate.hide{ opacity:0; pointer-events:none; }
  #gate .title{ font-weight:700; font-size:clamp(2.4rem,9vmin,5rem); line-height:1; }
  .grad{ background:linear-gradient(100deg,var(--violet),var(--magenta) 45%,var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #gate .hint{ color:var(--lilac); opacity:.78; max-width:22rem; }
  #pw{ width:min(80vw,20rem); padding:.8rem 1rem; border-radius:14px; border:1px solid rgba(233,213,255,.35);
    background:rgba(0,0,0,.3); color:var(--ink); font:inherit; text-align:center; }
  #unlock{ font:inherit; font-weight:500; letter-spacing:.06em; color:var(--ink); padding:.85rem 2.4rem; border-radius:999px;
    cursor:pointer; background:linear-gradient(100deg,rgba(139,92,246,.3),rgba(217,70,239,.3)); border:1px solid rgba(233,213,255,.5); }
  #unlock:disabled{ opacity:.6; cursor:default; } #err{ color:#ffb4c6; min-height:1.2em; font-size:.9rem; }
  #audioBtn{ position:fixed; right:16px; bottom:16px; z-index:20; width:46px; height:46px; border-radius:50%;
    display:none; align-items:center; justify-content:center; cursor:pointer; color:var(--ink);
    background:var(--glass); border:1px solid rgba(233,213,255,.3); backdrop-filter:blur(8px); }
  body.entered #audioBtn{ display:flex; } #audioBtn svg{ width:20px; height:20px; }
  :focus-visible{ outline:2px solid var(--pink); outline-offset:3px; border-radius:6px; }
</style></head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>
  <div id="gate">
    <div class="title grad">For you</div>
    <div class="hint" id="hint">Type the word only the two of us know.</div>
    <input id="pw" type="password" placeholder="password" autocomplete="off" />
    <button id="unlock" disabled>preparing…</button>
    <div id="err"></div>
  </div>
  <button id="audioBtn" aria-label="Toggle music"></button>
  <div class="beat" id="beat">lean in… tap to come closer</div>
  <div class="hintbar" id="hintbar">drag to look around · tap a star · pinch to move closer</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===================== CONFIG ===================== */
const CONFIG = { vaultFile:'vault.json', song:'song.mp3.mp3', songVolume:0.65, colorGrade:0.14, maxPhotos:500,
  flipLeft:false, flipRight:true /* mirror the right profile so they face each other */ };
const CHECK='nebula-of-you';

/* ===================== crypto ===================== */
const b64ToU8=s=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;};
async function deriveKey(pw,salt,iter){ const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']); }
const dec=(key,rec)=>crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToU8(rec.iv)},key,b64ToU8(rec.data));

/* ===================== music ===================== */
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
const ICON_MUTE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>';
const audioBtn=document.getElementById('audioBtn');
let audio=null, actx=null, analyser=null, freq=null, pulseSmooth=0;
function startMusicNow(){
  if(!CONFIG.song) return;
  if(!audio){ audio=new Audio(CONFIG.song); audio.loop=true; audio.crossOrigin='anonymous'; audio.preload='auto';
    try{ actx=new (window.AudioContext||window.webkitAudioContext)(); const src=actx.createMediaElementSource(audio);
      analyser=actx.createAnalyser(); analyser.fftSize=256; analyser.smoothingTimeConstant=0.82;
      src.connect(analyser); analyser.connect(actx.destination); freq=new Uint8Array(analyser.frequencyBinCount);
    }catch(e){ analyser=null; }
    audioBtn.innerHTML=ICON_PLAY;
    audioBtn.onclick=()=>{ if(actx&&actx.state==='suspended')actx.resume();
      if(audio.paused){audio.play().catch(()=>{});audioBtn.innerHTML=ICON_PLAY;} else{audio.pause();audioBtn.innerHTML=ICON_MUTE;} };
  }
  if(actx&&actx.state==='suspended') actx.resume();
  audio.volume=CONFIG.songVolume; audio.play().catch(()=>{});
}

/* ===================== three ===================== */
const MOBILE=matchMedia('(max-width:820px)').matches;
const SHELL=120;
const cvs=document.getElementById('scene');
let gl=null;
try{ const o={alpha:true,antialias:!MOBILE,failIfMajorPerformanceCaveat:false,powerPreference:'high-performance'};
  gl = cvs.getContext('webgl2',o) || cvs.getContext('webgl',o) || cvs.getContext('experimental-webgl',{alpha:true,failIfMajorPerformanceCaveat:false});
}catch(e){}
let renderer=null;
if(gl){ try{ renderer=new THREE.WebGLRenderer({canvas:cvs,context:gl,alpha:true,antialias:!MOBILE}); }
  catch(e){ try{ renderer=new THREE.WebGLRenderer({canvas:cvs,context:gl,alpha:true}); }catch(e2){} } }
if(!renderer){
  const g=document.getElementById('gate');
  if(g){ const h=g.querySelector('.hint'); if(h) h.innerHTML="Your browser\u2019s graphics acceleration is off. Fully quit &amp; reopen the browser, or turn on \u201cUse hardware/graphics acceleration\u201d in its settings, then reload. On a phone it works normally in Safari or Chrome.";
    const b=document.getElementById('unlock'); if(b) b.style.display='none'; const p=document.getElementById('pw'); if(p) p.style.display='none'; }
  throw new Error('WebGL unavailable');
}
renderer.setClearAlpha(0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,0.5,4000);
const clock=new THREE.Clock();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,t)=>{ t=clamp((t-a)/(b-a),0,1); return t*t*(3-2*t); };
const uPulse={value:0}, uTime={value:0}, uCell={value:new THREE.Vector2(1,1)},
      uLightPos={value:new THREE.Vector3(0,0,0)}, uTorchR={value:170}, uTorchK={value:1.0};

function discTexture(){ const s=64,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.4,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.beginPath();x.arc(s/2,s/2,s/2,0,7);x.fill();return new THREE.CanvasTexture(c); }
const DISC=discTexture();
function placeholderThumb(i,size){ const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  const hue=(255+i*29)%360; const g=x.createRadialGradient(size*.4,size*.35,size*.05,size*.5,size*.5,size*.8);
  g.addColorStop(0,`hsl(${hue} 75% 74%)`);g.addColorStop(1,`hsl(${(hue+28)%360} 60% 30%)`);
  x.fillStyle=g;x.fillRect(0,0,size,size); return c; }
function loadImage(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});}
function bytesToImage(buf){ return loadImage(URL.createObjectURL(new Blob([buf],{type:'image/jpeg'}))); }

let ATLAS=null;
async function buildAtlas(sources){
  const N=sources.length, CELL=N>300?96:128, PAD=4, STRIDE=CELL+PAD;
  const cols=Math.ceil(Math.sqrt(N)), rows=Math.ceil(N/cols), cw=cols*STRIDE, ch=rows*STRIDE;
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d'); const offsets=[];
  for(let i=0;i<N;i++){ const ax=i%cols,ay=(i/cols)|0,px=ax*STRIDE+PAD/2,py=ay*STRIDE+PAD/2;
    const img=sources[i],sc=Math.max(CELL/img.width,CELL/img.height),dw=img.width*sc,dh=img.height*sc;
    x.drawImage(img,px+(CELL-dw)/2,py+(CELL-dh)/2,dw,dh); offsets.push([px/cw,1-(py+CELL)/ch]); }
  const tex=new THREE.CanvasTexture(c); tex.generateMipmaps=false; tex.minFilter=tex.magFilter=THREE.LinearFilter;
  tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping; uCell.value.set(CELL/cw,CELL/ch);
  ATLAS={texture:tex,offsets,count:N,cu:CELL/cw,cv:CELL/ch}; return ATLAS;
}

/* nebula shaders */
const VERT=`precision highp float; uniform mat4 projectionMatrix, viewMatrix, modelMatrix;
attribute vec3 position, iPos, iColor; attribute vec2 uv, iOff; attribute float iScale, iSeed;
uniform vec2 uCell; uniform float uPulse, uTime, uSizeMul, uTorchR, uTorchK; uniform vec3 uLightPos;
varying vec2 vUv, vCorner; varying vec3 vColor; varying float vTor;
void main(){ vCorner=position.xy; vUv=iOff+uv*uCell; vColor=iColor;
  float t=uTime*0.25; vec3 c=iPos;
  c+=vec3( sin(iPos.y*0.017+t)+sin(iPos.z*0.011+t*0.7),
           cos(iPos.x*0.015+t*0.9)+sin(iPos.z*0.013+t*0.5),
           sin(iPos.x*0.012+t*0.6)+cos(iPos.y*0.016+t*0.8) )*4.0;
  vec3 wp=(modelMatrix*vec4(c,1.0)).xyz;
  vTor=1.0-smoothstep(0.0,uTorchR,distance(wp,uLightPos));
  vec4 mv=viewMatrix*vec4(wp,1.0); mv.xy+=position.xy*(iScale*uSizeMul*(1.0+uPulse*0.4+vTor*0.4));
  gl_Position=projectionMatrix*mv; }`;
const FRAG_PHOTO=`precision highp float; uniform sampler2D map; uniform float uGrade, uPulse; uniform vec3 uGradeColor;
varying vec2 vUv, vCorner; varying vec3 vColor; varying float vTor;
void main(){ float d=length(vCorner)*2.0; if(1.0-smoothstep(0.86,1.0,d)<0.5) discard;
  vec3 col=texture2D(map,vUv).rgb; col=mix(col,col*uGradeColor,uGrade); col+=col*(uPulse*0.25+vTor*1.1);
  gl_FragColor=vec4(col,1.0); }`;
const FRAG_HALO=`precision highp float; uniform float uPulse, uOpacity; varying vec2 vCorner; varying vec3 vColor; varying float vTor;
void main(){ float d=length(vCorner)*2.0; float a=pow(clamp(1.0-d,0.0,1.0),2.0);
  gl_FragColor=vec4(vColor*(0.7+uPulse*0.7+vTor*1.4), a*uOpacity*(0.55+uPulse*0.5+vTor*1.6)); }`;
const PALETTE=[[0.55,0.4,1.0],[0.85,0.35,0.95],[0.98,0.55,0.85],[0.6,0.7,1.0],[0.8,0.6,1.0]];
let galaxy=null, ambient=null, torchOrb=null, STAR=null;
function buildNebula(atlas){
  const N=atlas.count;
  const iPos=new Float32Array(N*3),iScale=new Float32Array(N),iOff=new Float32Array(N*2),iSeed=new Float32Array(N),iColor=new Float32Array(N*3);
  for(let i=0;i<N;i++){ const u=Math.random()*2-1,th=Math.random()*Math.PI*2,r=Math.sqrt(1-u*u);
    let dx=r*Math.cos(th),dy=u,dz=r*Math.sin(th); let rad=SHELL*(0.45+Math.random()*0.7);
    if(Math.random()<0.18) rad*=1.25+Math.random()*0.6; if(Math.random()<0.13){ rad=SHELL*(0.2+Math.random()*0.14); dy*=0.4; }
    iPos[i*3]=dx*rad;iPos[i*3+1]=dy*rad;iPos[i*3+2]=dz*rad;
    iScale[i]=(Math.random()<0.1?17:10)+Math.random()*6;
    const o=atlas.offsets[i]; iOff[i*2]=o[0]; iOff[i*2+1]=o[1]; iSeed[i]=Math.random();
    const p=PALETTE[(Math.random()*PALETTE.length)|0]; iColor[i*3]=p[0];iColor[i*3+1]=p[1];iColor[i*3+2]=p[2]; }
  STAR={pos:iPos, off:iOff, n:N};
  const qp=new Float32Array([-0.5,-0.5,0,0.5,-0.5,0,0.5,0.5,0,-0.5,0.5,0]), qu=new Float32Array([0,0,1,0,1,1,0,1]), idx=[0,1,2,0,2,3];
  function geom(){ const g=new THREE.InstancedBufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(qp,3)); g.setAttribute('uv',new THREE.BufferAttribute(qu,2)); g.setIndex(idx);
    g.setAttribute('iPos',new THREE.InstancedBufferAttribute(iPos,3)); g.setAttribute('iScale',new THREE.InstancedBufferAttribute(iScale,1));
    g.setAttribute('iOff',new THREE.InstancedBufferAttribute(iOff,2)); g.setAttribute('iSeed',new THREE.InstancedBufferAttribute(iSeed,1));
    g.setAttribute('iColor',new THREE.InstancedBufferAttribute(iColor,3)); return g; }
  const grp=new THREE.Group();
  const shared={uCell,uPulse,uTime,uTorchR,uTorchK,uLightPos};
  const haloMat=new THREE.RawShaderMaterial({uniforms:Object.assign({uSizeMul:{value:3.0},uOpacity:{value:0.5}},shared),
    vertexShader:VERT,fragmentShader:FRAG_HALO,transparent:true,depthWrite:false,depthTest:true,blending:THREE.AdditiveBlending});
  grp.add(Object.assign(new THREE.Mesh(geom(),haloMat),{frustumCulled:false}));
  const photoMat=new THREE.RawShaderMaterial({uniforms:Object.assign({map:{value:atlas.texture},uSizeMul:{value:1.0},
    uGrade:{value:CONFIG.colorGrade},uGradeColor:{value:new THREE.Vector3(0.72,0.55,1.0)}},shared),
    vertexShader:VERT,fragmentShader:FRAG_PHOTO,transparent:true,depthTest:true,depthWrite:true});
  grp.add(Object.assign(new THREE.Mesh(geom(),photoMat),{frustumCulled:false}));
  scene.add(grp); galaxy=grp;
}
function addAmbient(){
  const HN=MOBILE?1600:3600; const hp=new Float32Array(HN*3),hc=new Float32Array(HN*3),col=new THREE.Color();
  for(let i=0;i<HN;i++){ const u=Math.random()*2-1,th=Math.random()*Math.PI*2,r=Math.sqrt(1-u*u);
    let rad=SHELL*(0.35+Math.random()*0.85); if(Math.random()<0.25) rad*=1.3+Math.random()*0.7;
    hp[i*3]=r*Math.cos(th)*rad;hp[i*3+1]=u*rad;hp[i*3+2]=r*Math.sin(th)*rad;
    const p=PALETTE[(Math.random()*PALETTE.length)|0]; col.setRGB(p[0],p[1],p[2]); hc[i*3]=col.r;hc[i*3+1]=col.g;hc[i*3+2]=col.b; }
  const hg=new THREE.BufferGeometry(); hg.setAttribute('position',new THREE.BufferAttribute(hp,3)); hg.setAttribute('color',new THREE.BufferAttribute(hc,3));
  const haze=new THREE.Points(hg,new THREE.PointsMaterial({size:MOBILE?11:9,map:DISC,vertexColors:true,transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending}));
  haze.frustumCulled=false; scene.add(haze);
  const SN=MOBILE?900:1700,sp=new Float32Array(SN*3);
  for(let i=0;i<SN;i++){ const u=Math.random()*2-1,th=Math.random()*Math.PI*2,r=Math.sqrt(1-u*u),rad=600+Math.random()*1300;
    sp[i*3]=r*Math.cos(th)*rad;sp[i*3+1]=u*rad;sp[i*3+2]=r*Math.sin(th)*rad; }
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({size:2.4,map:DISC,color:0xe9d5ff,transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending})));
  const core=new THREE.Group();
  [[0xffffff,30,.8],[0xe9b8ff,72,.5],[0xd946ef,140,.3],[0x8b5cf6,240,.16]].forEach(([c,sz,op])=>{
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:DISC,color:c,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));
    s.scale.setScalar(sz); s.userData={base:sz,op}; core.add(s); });
  scene.add(core);
  torchOrb=new THREE.Sprite(new THREE.SpriteMaterial({map:DISC,color:0xf3e0ff,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false}));
  torchOrb.scale.setScalar(120); scene.add(torchOrb);
  ambient={haze,core};
}

/* ===================== kiss-gap entry (two profiles + glowing seam) ===================== */
function coverDraw(ctx,img,x,y,w,h,flip){ const s=Math.max(w/img.width,h/img.height), dw=img.width*s, dh=img.height*s;
  ctx.save(); if(flip){ ctx.translate(x+w,0); ctx.scale(-1,1); ctx.drawImage(img,(w-dw)/2,y+(h-dh)/2,dw,dh); }
  else ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh); ctx.restore(); }
function composeEntry(imgL,imgR){
  const W=1200,H=760,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#000';x.fillRect(0,0,W,H);
  coverDraw(x,imgL,0,0,W*0.6,H,CONFIG.flipLeft);
  coverDraw(x,imgR,W*0.4,0,W*0.6,H,CONFIG.flipRight);
  // fade both inner edges to black so faces emerge from darkness, leaving a dark gap
  let g=x.createLinearGradient(W*0.30,0,W*0.52,0); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,1)');
  x.fillStyle=g; x.fillRect(W*0.30,0,W*0.22,H);
  g=x.createLinearGradient(W*0.70,0,W*0.48,0); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,1)');
  x.fillStyle=g; x.fillRect(W*0.48,0,W*0.22,H);
  // glowing seam — the universe between them
  g=x.createLinearGradient(W*0.44,0,W*0.56,0);
  g.addColorStop(0,'rgba(139,92,246,0)'); g.addColorStop(0.5,'rgba(233,213,255,0.9)'); g.addColorStop(1,'rgba(217,70,239,0)');
  x.globalCompositeOperation='screen'; x.fillStyle=g; x.fillRect(W*0.44,H*0.12,W*0.12,H*0.76); x.globalCompositeOperation='source-over';
  // vignette
  const vg=x.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,W*0.7); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.9)');
  x.fillStyle=vg; x.fillRect(0,0,W,H);
  return c;
}
const P_VERT=`precision highp float; uniform mat4 projectionMatrix, modelViewMatrix;
attribute vec3 position, aColor, aScatter; attribute float aSeed;
uniform float uTime, uInhale, uFade, uSize, uBright; uniform vec3 uEye;
varying vec3 vColor; varying float vA;
void main(){ vec3 p=position;
  p+=vec3(sin(uTime*1.1+aSeed*6.28),cos(uTime*0.9+aSeed*5.0),sin(uTime*0.6+aSeed*4.0))*0.4;
  p=mix(p, uEye, uInhale*(0.25+0.75*aSeed));
  vec4 mv=modelViewMatrix*vec4(p,1.0); gl_PointSize=uSize*(300.0/max(1.0,-mv.z)); gl_Position=projectionMatrix*mv;
  vColor=aColor*uBright; vA=uFade; }`;
const P_FRAG=`precision highp float; varying vec3 vColor; varying float vA;
void main(){ if(vA<0.01) discard; vec2 c=gl_PointCoord-0.5; float d=length(c); if(d>0.5) discard;
  gl_FragColor=vec4(vColor, smoothstep(0.5,0.12,d)*vA); }`;
let entry=null;
function buildEntry(canvas, gap){
  const GW=MOBILE?200:280, GH=Math.round(GW*canvas.height/canvas.width);
  const cn=document.createElement('canvas');cn.width=GW;cn.height=GH;const cx=cn.getContext('2d'); cx.drawImage(canvas,0,0,GW,GH);
  const d=cx.getImageData(0,0,GW,GH).data; const visH=260, cell=visH/GH; const pts=[],cols=[],scat=[],seeds=[];
  for(let j=0;j<GH;j++) for(let i=0;i<GW;i++){ const k=(j*GW+i)*4; if(d[k]+d[k+1]+d[k+2]<34) continue; // skip black
    pts.push((i-GW/2+0.5)*cell,(GH/2-j-0.5)*cell,(Math.random()-0.5)*1.5);
    cols.push(d[k]/255,d[k+1]/255,d[k+2]/255);
    const dir=[Math.random()*2-1,Math.random()*2-1,Math.random()*2-1],m=140/(Math.hypot(dir[0],dir[1],dir[2])||1);
    scat.push(dir[0]*m,dir[1]*m,dir[2]*m); seeds.push(Math.random()); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3)); g.setAttribute('aColor',new THREE.Float32BufferAttribute(cols,3));
  g.setAttribute('aScatter',new THREE.Float32BufferAttribute(scat,3)); g.setAttribute('aSeed',new THREE.Float32BufferAttribute(seeds,1));
  const uni={uTime,uInhale:{value:0},uFade:{value:0},uBright:{value:1.35},uSize:{value:MOBILE?4.6:3.8},
    uEye:{value:new THREE.Vector3((gap[0]-0.5)*GW*cell,(0.5-gap[1])*GH*cell,0)}};
  const mat=new THREE.RawShaderMaterial({uniforms:uni,vertexShader:P_VERT,fragmentShader:P_FRAG,transparent:true,depthWrite:false,depthTest:false});
  const obj=new THREE.Points(g,mat); obj.frustumCulled=false; obj.renderOrder=15; scene.add(obj);
  entry={obj,uni,gapWorld:uni.uEye.value.clone()};
}

/* ===================== tap-to-bloom ===================== */
let bloom=null;
function makeBloomUVs(g,off){ const u0=off[0],v0=off[1],cu=ATLAS.cu,cv=ATLAS.cv;
  const uv=g.attributes.uv; uv.setXY(0,u0,v0+cv); uv.setXY(1,u0+cu,v0+cv); uv.setXY(2,u0,v0); uv.setXY(3,u0+cu,v0); uv.needsUpdate=true; }
function spawnBloom(idx){ const off=[STAR.off[idx*2],STAR.off[idx*2+1]];
  const pos=new THREE.Vector3(STAR.pos[idx*3],STAR.pos[idx*3+1],STAR.pos[idx*3+2]);
  if(!bloom){ const g=new THREE.PlaneGeometry(46,46);
    const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:ATLAS.texture,transparent:true,opacity:0,depthTest:false,depthWrite:false})); m.renderOrder=20;
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:DISC,color:0xe9c6ff,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false}));
    halo.scale.setScalar(120); halo.renderOrder=19; scene.add(halo); scene.add(m); bloom={mesh:m,halo,scale:0,off,pos,target:1}; }
  makeBloomUVs(bloom.mesh.geometry,off); bloom.off=off; bloom.pos.copy(pos); bloom.scale=0.001; bloom.target=1; }
function dismissBloom(){ if(bloom) bloom.target=0; }

/* ===================== controls ===================== */
let az=0.4, azV=0, polar=1.3, polarV=0, radius=180, targetRadius=180, exploring=false;
const pointers=new Map(); let lastPinch=0, downX=0, downY=0, moved=false, downT=0; const lightNDC=new THREE.Vector2(0,0);
cvs.addEventListener('pointerdown',e=>{ pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){ downX=e.clientX; downY=e.clientY; moved=false; downT=performance.now(); } });
addEventListener('pointermove',e=>{ const nx=(e.clientX/innerWidth)*2-1, ny=-(e.clientY/innerHeight)*2+1; lightNDC.set(nx,ny);
  if(!pointers.has(e.pointerId)) return; const prev=pointers.get(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size>=2){ const p=[...pointers.values()]; const dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(lastPinch&&exploring) targetRadius=clamp(targetRadius+(lastPinch-dist)*0.5,60,300); lastPinch=dist; return; }
  const dx=e.clientX-prev.x, dy=e.clientY-prev.y; if(Math.hypot(e.clientX-downX,e.clientY-downY)>8) moved=true;
  if(exploring){ azV+=-dx*0.0018; polarV+=-dy*0.0018; } });
addEventListener('pointerup',e=>{ const wasTap=!moved && performance.now()-downT<400 && pointers.size===1;
  pointers.delete(e.pointerId); if(pointers.size<2) lastPinch=0; if(wasTap) handleTap(e.clientX,e.clientY); });
addEventListener('pointercancel',e=>{ pointers.delete(e.pointerId); if(pointers.size<2) lastPinch=0; });
addEventListener('wheel',e=>{ if(exploring) targetRadius=clamp(targetRadius+e.deltaY*0.15,60,300); },{passive:true});

let diving=false, introT=0;
function handleTap(cx,cy){
  if(!exploring){ if(entry && !diving) diving=true; return; }   // tap during intro -> begin the dive
  if(!STAR) return;
  let best=-1,bestD=44*44; const _w=new THREE.Vector3();
  for(let i=0;i<STAR.n;i++){ _w.set(STAR.pos[i*3],STAR.pos[i*3+1],STAR.pos[i*3+2]).applyMatrix4(galaxy.matrixWorld).project(camera);
    if(_w.z>1) continue; const sx=(_w.x*0.5+0.5)*innerWidth, sy=(-_w.y*0.5+0.5)*innerHeight; const dd=(sx-cx)*(sx-cx)+(sy-cy)*(sy-cy);
    if(dd<bestD){ bestD=dd; best=i; } }
  if(best>=0) spawnBloom(best); else dismissBloom();
}

function resize(){ renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize',resize);

const beat=document.getElementById('beat'), hintbar=document.getElementById('hintbar');
let cinematic=false, started=0;
const _v=new THREE.Vector3(), _d=new THREE.Vector3(), _s2=new THREE.Vector3();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05); uTime.value+=dt;
  let target=0;
  if(analyser){ analyser.getByteFrequencyData(freq); let b=0; for(let i=0;i<10;i++)b+=freq[i]; target=Math.min(1,(b/(10*255))*1.4); }
  else target=0.35+0.25*Math.sin(uTime.value*1.6);
  pulseSmooth+=(target-pulseSmooth)*(target>pulseSmooth?0.35:0.08); uPulse.value=pulseSmooth;

  if(cinematic && !exploring){
    // INTRO: hold on the two faces; tap dives through the glowing gap
    const G=entry.gapWorld;
    if(diving){ introT=Math.min(1,introT+dt/2.6); }
    const t=introT;
    if(t<0.6){ const k=smooth(0,0.6,t);
      camera.position.set(lerp(0,G.x*0.85,k), lerp(0,G.y*0.85,k), lerp(200,90,k)); camera.lookAt(G.x,G.y,0);
      entry.uni.uInhale.value=k*0.6; entry.uni.uFade.value=1;
    } else { const k=smooth(0.6,1.0,t);
      camera.position.set(lerp(G.x*0.85,0,k), lerp(G.y*0.85,0,k), lerp(90,40,k)); camera.lookAt(0,0,0);
      entry.uni.uInhale.value=0.6+k*0.4; entry.uni.uFade.value=1-k;
    }
    if(introT>=1){ exploring=true; scene.remove(entry.obj); entry=null; az=Math.PI/2; polar=Math.PI/2; radius=40; targetRadius=175; started=performance.now(); }
    beat.classList.toggle('show', !diving);
  } else {
    // EXPLORE
    az+=azV+0.02*dt; azV*=0.94; polar=clamp(polar+polarV,0.35,2.8); polarV*=0.94; radius+=(targetRadius-radius)*0.08;
    const sp=Math.sin(polar); camera.position.set(radius*sp*Math.cos(az),radius*Math.cos(polar),radius*sp*Math.sin(az)); camera.lookAt(0,0,0);
    beat.classList.remove('show');
    if(started) hintbar.classList.toggle('show', performance.now()-started<6000);
  }

  // headlight
  _v.set(lightNDC.x,lightNDC.y,0.5).unproject(camera); _d.copy(_v).sub(camera.position).normalize();
  uLightPos.value.copy(camera.position).addScaledVector(_d, Math.max(60,radius*0.9));
  if(torchOrb){ torchOrb.position.copy(uLightPos.value); torchOrb.material.opacity=(exploring?0.4:0.12)+0.35*pulseSmooth; torchOrb.scale.setScalar(120+40*pulseSmooth); }

  if(ambient){ ambient.haze.rotation.y+=dt*0.015; ambient.haze.material.opacity=0.42+0.3*pulseSmooth;
    ambient.core.children.forEach(s=>{ s.scale.setScalar(s.userData.base*(1+pulseSmooth*0.55)); s.material.opacity=s.userData.op*(0.7+pulseSmooth*0.6); }); }

  if(bloom){ bloom.scale+=((bloom.target)-bloom.scale)*0.18;
    if(bloom.target===0 && bloom.scale<0.02){ scene.remove(bloom.mesh); scene.remove(bloom.halo); bloom=null; }
    else{ const camDir=_v.copy(camera.position).sub(bloom.pos).normalize(); const p=_s2.copy(bloom.pos).addScaledVector(camDir,26);
      bloom.mesh.position.copy(p); bloom.mesh.lookAt(camera.position); const sc=bloom.scale*(radius/150);
      bloom.mesh.scale.setScalar(Math.max(0.001,sc)); bloom.mesh.material.opacity=bloom.scale;
      bloom.halo.position.copy(p); bloom.halo.scale.setScalar(120*sc); bloom.halo.material.opacity=bloom.scale*(0.5+pulseSmooth*0.4); } }

  renderer.render(scene,camera);
});

/* ===================== gate ===================== */
const gate=document.getElementById('gate'), pwEl=document.getElementById('pw'),
  unlockBtn=document.getElementById('unlock'), errEl=document.getElementById('err'), hintEl=document.getElementById('hint');
let vault=null, demo=false;
function reveal(){ document.body.classList.add('entered'); gate.classList.add('hide'); setTimeout(()=>gate.remove(),1100);
  if(cinematic && entry){ entry.uni.uFade.value=1; } else { exploring=true; started=performance.now(); } }

async function tryUnlock(){
  startMusicNow(); errEl.textContent=''; unlockBtn.disabled=true;
  if(demo){ const imgs=[]; for(let i=0;i<(MOBILE?150:190);i++) imgs.push(placeholderThumb(i,128));
    buildNebula(await buildAtlas(imgs)); reveal(); return; }
  const pw=pwEl.value; if(!pw){ unlockBtn.disabled=false; return; }
  unlockBtn.textContent='unlocking…';
  try{
    const key=await deriveKey(pw,b64ToU8(vault.salt),vault.iter);
    try{ if(new TextDecoder().decode(await dec(key,vault.check))!==CHECK) throw 0; }
    catch{ errEl.textContent='That isn\u2019t the word. Try again.'; unlockBtn.disabled=false; unlockBtn.textContent='unlock'; return; }
    let L=null,R=null;
    if(vault.cover){ try{ L=await bytesToImage(await dec(key,vault.cover)); }catch(_){}}
    if(vault.closing){ try{ R=await bytesToImage(await dec(key,vault.closing)); }catch(_){}}
    const items=vault.items.slice(0,CONFIG.maxPhotos), imgs=[];
    for(let i=0;i<items.length;i++){ unlockBtn.textContent=`opening… ${Math.round((i+1)/items.length*100)}%`;
      try{ imgs.push(await bytesToImage(await dec(key,items[i]))); }catch(_){} }
    if(!imgs.length){ errEl.textContent='No photos found in the vault.'; unlockBtn.disabled=false; unlockBtn.textContent='unlock'; return; }
    buildNebula(await buildAtlas(imgs));
    if(L&&R){ const lipL=(vault.cover.eye)||[0.85,0.6], lipR=(vault.closing.eye)||[0.15,0.6];
      // gap = between the two lips within the composed frame (left occupies ~0..0.6, right ~0.4..1)
      const gx=((lipL[0]*0.6)+(0.4+ (CONFIG.flipRight?(1-lipR[0]):lipR[0])*0.6))/2;
      const gy=((lipL[1])+(lipR[1]))/2; buildEntry(composeEntry(L,R),[clamp(gx,0.3,0.7),clamp(gy,0,1)]); cinematic=true; }
    reveal();
  }catch(e){ errEl.textContent='Something went wrong opening it.'; unlockBtn.disabled=false; unlockBtn.textContent='unlock'; }
}
unlockBtn.addEventListener('click',tryUnlock);
pwEl.addEventListener('keydown',e=>{ if(e.key==='Enter') tryUnlock(); });

/* ===================== boot ===================== */
(async function init(){
  resize(); addAmbient();
  if(!(window.crypto&&crypto.subtle)) demo=true;
  else { try{ const r=await fetch(CONFIG.vaultFile,{cache:'no-store'}); if(!r.ok) throw 0; vault=await r.json(); if(!vault.items) throw 0; }catch{ demo=true; } }
  if(demo){ hintEl.textContent='Preview mode — add vault.json to lock it.'; pwEl.style.display='none'; unlockBtn.textContent='begin'; }
  else unlockBtn.textContent='unlock';
  unlockBtn.disabled=false;
})();
</script>
